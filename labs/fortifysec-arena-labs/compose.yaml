name: fortifysec-training-labs
services:
  web-auth:
    build: ./labs/web-auth
    ports:
      - '127.0.0.1:8101:8000'
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 80
    mem_limit: 128m
    restart: unless-stopped
  api-idor:
    build: ./labs/api-idor
    ports:
      - '127.0.0.1:8102:8000'
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 80
    mem_limit: 128m
    restart: unless-stopped
  log-forensics:
    build: ./labs/log-forensics
    ports:
      - '127.0.0.1:8103:8000'
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 80
    mem_limit: 128m
    restart: unless-stopped
