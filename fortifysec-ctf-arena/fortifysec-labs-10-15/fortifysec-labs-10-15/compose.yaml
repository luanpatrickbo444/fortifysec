services:
  fs-010:
    build: ./app
    environment:
      LAB_ID: '10'
      LAB_FLAG: ${FS_10_FLAG:?Configure FS_10_FLAG in .env}
    ports:
    - 127.0.0.1:19110:8080
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
