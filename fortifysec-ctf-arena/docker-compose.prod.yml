services:
  ctfd:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CTF_DOMAIN: ${CTF_DOMAIN:?Configure CTF_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ctfd]
    networks: [proxy]
volumes:
  caddy_data:
  caddy_config:
